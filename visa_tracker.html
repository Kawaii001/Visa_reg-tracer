        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-expired {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-urgent {
            background: #fef3c7;
            color: #b45309;
            animation: pulse 2s infinite;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .country-flag {
            font-size: 28px;
            margin-right: 8px;
            display: inline-block;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #667eea;
            outline: none;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 8px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f3f4f6;
            border-bottom: 2px solid #e5e7eb;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:hover {
            background: #f9fafb;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #e5e7eb;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tag:hover {
            background: #e5e7eb;
        }

        .filter-tag.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal {
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 13px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .country-selector {
            position: relative;
        }

        .country-option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }

        .country-option:hover {
            background: #f9fafb;
        }

        .badge-outline {
            display: inline-block;
            padding: 4px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 12px;
            background: white;
            color: #374151;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>

                room: '312',
                visaExpires: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                registrationExpires: new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop',
                createdAt: new Date().toISOString()
            },
            {
                id: '2',
                firstName: 'Мария',
                lastName: 'Петрова',
                patronymic: 'Ивановна',
                passportSeries: 'BB654321',
                citizenship: 'RU',
                course: 1,
                specialty: 'Экономика',
                dormitory: '3',
                room: '201',
                visaExpires: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                registrationExpires: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                photo: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop',
                createdAt: new Date().toISOString()
            }
        ];

        // ══════════════════════════════════════════════════════════════
        // 🔌 КОНФИГУРАЦИЯ API (Google Apps Script Web App)
        // ══════════════════════════════════════════════════════════════
        const API_URL = 'https://script.google.com/macros/s/AKfycbx02E9qUqcLZXISzo-jMFory8R-LyUWysIfYqZixacDj2D9ekhkk6ACgNxGsnkIl0B8jw/exec';

        // Вызов бэкенда (POST) — text/plain избегает CORS preflight у Apps Script
        async function apiCall(action, payload = {}) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, ...payload })
            });
            return response.json();
        }

        // Привести дату из Google Sheets (может прийти как ISO-строка или объект Date) к YYYY-MM-DD
        const toDateInputValue = (value) => {
            if (!value) return '';
            const d = new Date(value);
            if (isNaN(d.getTime())) return '';
            return d.toISOString().split('T')[0];
        };

        // Преобразовать запись из Google Sheets (русские заголовки) в формат фронтенда
        const fromBackend = (s) => ({
            id: s['ID'],
            firstName: s['Имя'] || '',
            lastName: s['Фамилия'] || '',
            patronymic: s['Отчество'] || '',
            passportSeries: s['Паспорт'] || '',
            citizenship: s['Гражданство'] || 'UZ',
            course: s['Курс'] || 1,
            specialty: s['Специальность'] || SPECIALTIES[0],
            dormitory: s['Общежитие'] || '',
            room: s['Комната'] || '',
            visaExpires: toDateInputValue(s['Виза (дата)']),
            registrationExpires: toDateInputValue(s['Регистрация (дата)']),
            photo: s['photo'] || '',
            createdAt: s['Дата добавления']
        });

        // Преобразовать данные формы (фронтенд) в объект для добавления студента
        const toBackendAdd = (formData) => ({
            firstName: formData.firstName,
            lastName: formData.lastName,
            patronymic: formData.patronymic,
            passportSeries: formData.passportSeries,
            citizenship: formData.citizenship,
            specialty: formData.specialty,
            course: formData.course,
            dormitory: formData.dormitory,
            room: formData.room,
            visaExpires: formData.visaExpires,
            registrationExpires: formData.registrationExpires
        });

        // Преобразовать данные формы в объект обновления (ключи — русские заголовки Sheets)
        const toBackendUpdate = (formData) => ({
            'Имя': formData.firstName,
            'Фамилия': formData.lastName,
            'Отчество': formData.patronymic,
            'Паспорт': formData.passportSeries,
            'Гражданство': formData.citizenship,
            'Специальность': formData.specialty,
            'Курс': formData.course,
            'Общежитие': formData.dormitory,
            'Комната': formData.room,
            'Виза (дата)': formData.visaExpires,
            'Регистрация (дата)': formData.registrationExpires
        });

        const calculateDaysUntil = (date) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const targetDate = new Date(date);
            targetDate.setHours(0, 0, 0, 0);
            const diff = targetDate - today;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        };

        const getStatusBadge = (date) => {
            const days = calculateDaysUntil(date);
            if (days < 0) {
                return { status: 'expired', text: 'Истёк', color: 'status-expired' };
            } else if (days <= 30) {
                return { status: 'urgent', text: `${days} дн.`, color: 'status-urgent' };
            } else {
                return { status: 'active', text: `${days} дн.`, color: 'status-active' };
            }
        };

        function VisaTrackerApp() {
            const [students, setStudents] = React.useState([]);
            const [filteredStudents, setFilteredStudents] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);
            const [loadError, setLoadError] = React.useState('');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('table');
            const [selectedStudent, setSelectedStudent] = React.useState(null);
            const [showAddModal, setShowAddModal] = React.useState(false);
            const [showEditModal, setShowEditModal] = React.useState(false);
            const [selectedCountryFilter, setSelectedCountryFilter] = React.useState('');
            const [selectedSpecialtyFilter, setSelectedSpecialtyFilter] = React.useState('');
            const [formData, setFormData] = React.useState({
                firstName: '',
                lastName: '',
                patronymic: '',
                passportSeries: '',
                citizenship: 'UZ',
                course: 1,
                specialty: SPECIALTIES[0],
                dormitory: '',
                room: '',
                visaExpires: '',
                registrationExpires: '',
                photo: ''
            });

            const loadStudents = async () => {
                setIsLoading(true);
                setLoadError('');
                try {
                    const data = await apiCall('GET_ALL_STUDENTS');
                    if (data && data.error) throw new Error(data.error);
                    const mapped = (data || []).map(fromBackend);
                    setStudents(mapped);
                    setFilteredStudents(mapped);
                } catch (err) {
                    console.error('Ошибка загрузки студентов:', err);
                    setLoadError('Не удалось загрузить данные с сервера. Проверьте подключение.');
                } finally {
                    setIsLoading(false);
                }
            };

            React.useEffect(() => {
                loadStudents();
            }, []);

            const handleSearch = (query) => {
                setSearchQuery(query);
                filterStudents(query, selectedCountryFilter, selectedSpecialtyFilter);
            };

            const filterStudents = (query, country, specialty) => {
                let result = students;

                if (query) {
                    const q = query.toLowerCase();
                    result = result.filter(s =>
                        s.firstName.toLowerCase().includes(q) ||
                        s.lastName.toLowerCase().includes(q) ||
                        s.passportSeries.toLowerCase().includes(q)
                    );
                }

                if (country) {
                    result = result.filter(s => s.citizenship === country);
                }

                if (specialty) {
                    result = result.filter(s => s.specialty === specialty);
                }

                setFilteredStudents(result);
            };

            const handleCountryFilter = (code) => {
                setSelectedCountryFilter(code === selectedCountryFilter ? '' : code);
                filterStudents(searchQuery, code === selectedCountryFilter ? '' : code, selectedSpecialtyFilter);
            };

            const handleSpecialtyFilter = (spec) => {
                setSelectedSpecialtyFilter(spec === selectedSpecialtyFilter ? '' : spec);
                filterStudents(searchQuery, selectedCountryFilter, spec === selectedSpecialtyFilter ? '' : spec);
            };

            const handleAddStudent = async () => {
                try {
                    const result = await apiCall('ADD_STUDENT', { student: toBackendAdd(formData) });
                    if (!result.success) throw new Error(result.message || 'Ошибка добавления');
                    await loadStudents();
                    setFormData({
                        firstName: '',
                        lastName: '',
                        patronymic: '',
                        passportSeries: '',
                        citizenship: 'UZ',
                        course: 1,
                        specialty: SPECIALTIES[0],
                        dormitory: '',
                        room: '',
                        visaExpires: '',
                        registrationExpires: '',
                        photo: ''
                    });
                    setShowAddModal(false);
                } catch (err) {
                    console.error('Ошибка добавления студента:', err);
                    alert('Не удалось добавить студента. Попробуйте снова.');
                }
            };

            const handleUpdateStudent = async () => {
                try {
                    const result = await apiCall('UPDATE_STUDENT', {
                        studentId: selectedStudent.id,
                        updates: toBackendUpdate(formData)
                    });
                    if (!result.success) throw new Error(result.message || 'Ошибка обновления');
                    await loadStudents();
                    setShowEditModal(false);
                    setSelectedStudent(null);
                } catch (err) {
                    console.error('Ошибка обновления студента:', err);
                    alert('Не удалось обновить данные студента. Попробуйте снова.');
                }
            };

            const handleDeleteStudent = async (id) => {
                try {
                    const result = await apiCall('DELETE_STUDENT', { studentId: id });
                    if (!result.success) throw new Error(result.message || 'Ошибка удаления');
                    await loadStudents();
                    setSelectedStudent(null);
                } catch (err) {
                    console.error('Ошибка удаления студента:', err);
                    alert('Не удалось удалить студента. Попробуйте снова.');
                }
            };

            const openEditModal = (student) => {
                setSelectedStudent(student);
                setFormData({
                    firstName: student.firstName,
                    lastName: student.lastName,
                    patronymic: student.patronymic,
                    passportSeries: student.passportSeries,
                    citizenship: student.citizenship,
                    course: student.course,
                    specialty: student.specialty,
                    dormitory: student.dormitory,
                    room: student.room,
                    visaExpires: student.visaExpires,
                    registrationExpires: student.registrationExpires,
                    photo: student.photo
                });
                setShowEditModal(true);
            };

            const visaStatus = selectedStudent ? getStatusBadge(selectedStudent.visaExpires) : null;
            const regStatus = selectedStudent ? getStatusBadge(selectedStudent.registrationExpires) : null;

            const expiredCount = students.filter(s => calculateDaysUntil(s.visaExpires) < 0 || calculateDaysUntil(s.registrationExpires) < 0).length;
            const urgentCount = students.filter(s => {
                const visaDays = calculateDaysUntil(s.visaExpires);
                const regDays = calculateDaysUntil(s.registrationExpires);
                return (visaDays >= 0 && visaDays <= 30) || (regDays >= 0 && regDays <= 30);
            }).length;

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-600 to-purple-600">
                        <div className="text-white text-center">
                            <div className="text-4xl mb-4">⏳</div>
                            <div className="text-xl font-semibold">Загрузка данных...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 md:p-8">
                        <div className="container mx-auto">
                            <h1 className="text-3xl md:text-4xl font-bold mb-2">📋 Visa Tracker ТГТУ</h1>
                            <p className="text-blue-100">Управление визами и регистрацией международных студентов</p>
                            {loadError && (
                                <div className="mt-3 bg-red-500/90 text-white px-4 py-2 rounded-lg text-sm">
                                    ⚠️ {loadError}
                                    <button onClick={loadStudents} className="ml-3 underline font-semibold">Повторить</button>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Stats */}
                    <div className="bg-white p-4 md:p-8 border-b border-gray-200">
                        <div className="container mx-auto">
                            <div className="stats-grid">
                                <div className="stat-card">
                                    <div className="stat-number">{students.length}</div>
                                    <div className="stat-label">Всего студентов</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number" style={{ color: '#fbbf24' }}>{expiredCount}</div>
                                    <div className="stat-label">Истекшие документы</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number" style={{ color: '#34d399' }}>{urgentCount}</div>
                                    <div className="stat-label">Требуют внимания</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{students.filter(s => calculateDaysUntil(s.visaExpires) > 30 && calculateDaysUntil(s.registrationExpires) > 30).length}</div>
                                    <div className="stat-label">В порядке</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="bg-gray-50 p-4 md:p-8 min-h-screen">
                        <div className="container mx-auto">
                            {/* Search and Filters */}
                            <div className="glass-effect rounded-xl p-6 mb-6">
                                <div className="mb-4">
                                    <input
                                        type="text"
                                        placeholder="🔍 Поиск по ФИО или паспорту..."
                                        value={searchQuery}
                                        onChange={(e) => handleSearch(e.target.value)}
                                        className="w-full search-input px-4 py-3 rounded-lg border-2 border-transparent focus:border-blue-500"
                                    />
                                </div>

                                {/* Country Filter */}
                                <div className="mb-4">
                                    <label className="block text-sm font-semibold text-gray-700 mb-3">По гражданству:</label>
                                    <div className="flex flex-wrap gap-2">
                                        {Object.entries(COUNTRIES).slice(0, 10).map(([code, { name, flag }]) => (
                                            <button
                                                key={code}
                                                onClick={() => handleCountryFilter(code)}
                                                className={`filter-tag ${selectedCountryFilter === code ? 'active' : ''}`}
                                            >
                                                <span className="country-flag" style={{ fontSize: '16px', marginRight: '4px' }}>{flag}</span>
                                                {name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Specialty Filter */}
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-3">По специальности:</label>
                                    <div className="flex flex-wrap gap-2">
                                        {SPECIALTIES.map(specialty => (
                                            <button
                                                key={specialty}
                                                onClick={() => handleSpecialtyFilter(specialty)}
                                                className={`filter-tag ${selectedSpecialtyFilter === specialty ? 'active' : ''}`}
                                            >
                                                {specialty}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Add Button */}
                            <div className="mb-6 flex justify-between items-center">
                                <h2 className="text-2xl font-bold text-gray-900">Студенты ({filteredStudents.length})</h2>
                                <button
                                    onClick={() => setShowAddModal(true)}
                                    className="btn-primary"
                                >
                                    + Добавить студента
                                </button>
                            </div>

                            {/* Students Table */}
                            {filteredStudents.length > 0 ? (
                                <div className="glass-effect rounded-xl overflow-hidden">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Студент</th>
                                                <th>Паспорт</th>
                                                <th>Гражданство</th>
                                                <th>Виза</th>
                                                <th>Регистрация</th>
                                                <th>Действия</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredStudents.map(student => {
                                                const visaBadge = getStatusBadge(student.visaExpires);
                                                const regBadge = getStatusBadge(student.registrationExpires);
                                                return (
                                                    <tr key={student.id} className="card-hover">
                                                        <td>
                                                            <div className="flex items-center gap-3">
                                                                <img src={student.photo} alt="" className="avatar" />
                                                                <div>
                                                                    <div className="font-semibold text-gray-900">
                                                                        {student.firstName} {student.lastName}
                                                                    </div>
                                                                    <div className="text-sm text-gray-600">
                                                                        {student.specialty} • {student.course} курс
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <span className="badge-outline">{student.passportSeries}</span>
                                                        </td>
                                                        <td>
                                                            <div className="flex items-center gap-2">
                                                                <span style={{ fontSize: '20px' }}>{COUNTRIES[student.citizenship]?.flag}</span>
                                                                <span className="text-sm font-medium">{COUNTRIES[student.citizenship]?.name}</span>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div className={`status-badge ${visaBadge.color}`}>
                                                                📅 {visaBadge.text}
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div className={`status-badge ${regBadge.color}`}>
                                                                🏠 {regBadge.text}
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div className="flex gap-2">
                                                                <button
                                                                    onClick={() => setSelectedStudent(student)}
                                                                    className="btn-secondary"
                                                                    style={{ padding: '6px 12px', fontSize: '12px' }}
                                                                >
                                                                    Просмотр
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className="glass-effect rounded-xl">
                                    <div className="empty-state">
                                        <div className="empty-state-icon">🔍</div>
                                        <h3 className="text-lg font-semibold text-gray-900 mb-2">Студентов не найдено</h3>
                                        <p className="text-gray-600">Попробуйте изменить фильтры поиска</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Student Detail Modal */}
                    {selectedStudent && !showEditModal && (
                        <div className="modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50">
                            <div className="glass-effect rounded-xl max-w-2xl w-full slide-in">
                                <div className="p-6 border-b border-gray-200 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-gray-900">Профиль студента</h2>
                                    <button
                                        onClick={() => setSelectedStudent(null)}
                                        className="text-gray-500 hover:text-gray-700 text-2xl"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto max-h-[calc(90vh-120px)]">
                                    <div className="flex gap-6 mb-6">
                                        <img src={selectedStudent.photo} alt="" className="w-32 h-32 rounded-lg object-cover" />
                                        <div className="flex-1">
                                            <h3 className="text-2xl font-bold text-gray-900 mb-2">
                                                {selectedStudent.firstName} {selectedStudent.lastName} {selectedStudent.patronymic}
                                            </h3>
                                            <div className="space-y-2 text-gray-600">
                                                <div>
                                                    <span className="font-semibold">Паспорт:</span> {selectedStudent.passportSeries}
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-semibold">Гражданство:</span>
                                                    <span style={{ fontSize: '24px' }}>{COUNTRIES[selectedStudent.citizenship]?.flag}</span>
                                                    <span>{COUNTRIES[selectedStudent.citizenship]?.name}</span>
                                                </div>
                                                <div>
                                                    <span className="font-semibold">Специальность:</span> {selectedStudent.specialty}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div className="bg-blue-50 p-4 rounded-lg">
                                            <div className="text-sm font-semibold text-gray-600 mb-2">📚 Учёба</div>
                                            <div className="space-y-2">
                                                <div><span className="text-gray-600">Курс:</span> <span className="font-bold">{selectedStudent.course}</span></div>
                                                <div><span className="text-gray-600">Специальность:</span> <span className="font-bold text-sm">{selectedStudent.specialty}</span></div>
                                            </div>
                                        </div>

                                        <div className="bg-purple-50 p-4 rounded-lg">
                                            <div className="text-sm font-semibold text-gray-600 mb-2">🏠 Проживание</div>
                                            <div className="space-y-2">
                                                <div><span className="text-gray-600">Общежитие:</span> <span className="font-bold">{selectedStudent.dormitory}</span></div>
                                                <div><span className="text-gray-600">Комната:</span> <span className="font-bold">{selectedStudent.room}</span></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div className={`p-4 rounded-lg ${visaStatus.color === 'status-expired' ? 'bg-red-50' : visaStatus.color === 'status-urgent' ? 'bg-yellow-50' : 'bg-green-50'}`}>
                                            <div className="text-sm font-semibold text-gray-600 mb-2">📋 Виза</div>
                                            <div className="text-sm text-gray-600 mb-2">{selectedStudent.visaExpires}</div>
                                            <div className={`status-badge ${visaStatus.color}`}>
                                                {visaStatus.text}
                                            </div>
                                        </div>

                                        <div className={`p-4 rounded-lg ${regStatus.color === 'status-expired' ? 'bg-red-50' : regStatus.color === 'status-urgent' ? 'bg-yellow-50' : 'bg-green-50'}`}>
                                            <div className="text-sm font-semibold text-gray-600 mb-2">📍 Регистрация</div>
                                            <div className="text-sm text-gray-600 mb-2">{selectedStudent.registrationExpires}</div>
                                            <div className={`status-badge ${regStatus.color}`}>
                                                {regStatus.text}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-6 border-t border-gray-200 flex gap-3">
                                    <button
                                        onClick={() => openEditModal(selectedStudent)}
                                        className="btn-primary flex-1"
                                    >
                                        ✏️ Редактировать
                                    </button>
                                    <button
                                        onClick={() => {
                                            handleDeleteStudent(selectedStudent.id);
                                            setSelectedStudent(null);
                                        }}
                                        className="btn-secondary"
                                        style={{ color: '#dc2626' }}
                                    >
                                        🗑️ Удалить
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add/Edit Modal */}
                    {(showAddModal || showEditModal) && (
                        <div className="modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50">
                            <div className="glass-effect rounded-xl max-w-2xl w-full modal slide-in">
                                <div className="p-6 border-b border-gray-200 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-gray-900">
                                        {showEditModal ? 'Редактировать студента' : 'Добавить студента'}
                                    </h2>
                                    <button
                                        onClick={() => {
                                            setShowAddModal(false);
                                            setShowEditModal(false);
                                        }}
                                        className="text-gray-500 hover:text-gray-700 text-2xl"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto max-h-[calc(90vh-120px)]">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="form-group">
                                            <label className="form-label">Имя *</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.firstName}
                                                onChange={(e) => setFormData({ ...formData, firstName: e.target.value })}
                                                placeholder="Ахмад"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Фамилия *</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.lastName}
                                                onChange={(e) => setFormData({ ...formData, lastName: e.target.value })}
                                                placeholder="Хасанов"
                                            />
                                        </div>

                                        <div className="form-group col-span-2">
                                            <label className="form-label">Отчество</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.patronymic}
                                                onChange={(e) => setFormData({ ...formData, patronymic: e.target.value })}
                                                placeholder="Рахманович"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Паспорт *</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.passportSeries}
                                                onChange={(e) => setFormData({ ...formData, passportSeries: e.target.value })}
                                                placeholder="AА123456"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Гражданство *</label>
                                            <select
                                                className="form-select"
                                                value={formData.citizenship}
                                                onChange={(e) => setFormData({ ...formData, citizenship: e.target.value })}
                                            >
                                                {Object.entries(COUNTRIES).map(([code, { name, flag }]) => (
                                                    <option key={code} value={code}>{flag} {name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Специальность *</label>
                                            <select
                                                className="form-select"
                                                value={formData.specialty}
                                                onChange={(e) => setFormData({ ...formData, specialty: e.target.value })}
                                            >
                                                {SPECIALTIES.map(spec => (
                                                    <option key={spec} value={spec}>{spec}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Курс *</label>
                                            <select
                                                className="form-select"
                                                value={formData.course}
                                                onChange={(e) => setFormData({ ...formData, course: parseInt(e.target.value) })}
                                            >
                                                {[1, 2, 3, 4, 5].map(c => (
                                                    <option key={c} value={c}>{c}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Общежитие *</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.dormitory}
                                                onChange={(e) => setFormData({ ...formData, dormitory: e.target.value })}
                                                placeholder="5"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Комната *</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.room}
                                                onChange={(e) => setFormData({ ...formData, room: e.target.value })}
                                                placeholder="312"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Виза истекает *</label>
                                            <input
                                                type="date"
                                                className="form-input"
                                                value={formData.visaExpires}
                                                onChange={(e) => setFormData({ ...formData, visaExpires: e.target.value })}
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label className="form-label">Регистрация истекает *</label>
                                            <input
                                                type="date"
                                                className="form-input"
                                                value={formData.registrationExpires}
                                                onChange={(e) => setFormData({ ...formData, registrationExpires: e.target.value })}
                                            />
                                        </div>

                                        <div className="form-group col-span-2">
                                            <label className="form-label">URL фото</label>
                                            <input
                                                type="text"
                                                className="form-input"
                                                value={formData.photo}
                                                onChange={(e) => setFormData({ ...formData, photo: e.target.value })}
                                                placeholder="https://..."
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="p-6 border-t border-gray-200 flex gap-3">
                                    <button
                                        onClick={() => {
                                            if (showEditModal) {
                                                handleUpdateStudent();
                                            } else {
                                                handleAddStudent();
                                            }
                                        }}
                                        className="btn-primary flex-1"
                                    >
                                        {showEditModal ? '💾 Сохранить' : '➕ Добавить'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            setShowAddModal(false);
                                            setShowEditModal(false);
                                        }}
                                        className="btn-secondary flex-1"
                                    >
                                        Отмена
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<VisaTrackerApp />, document.getElementById('root'));
    </script>
</body>
</html>
